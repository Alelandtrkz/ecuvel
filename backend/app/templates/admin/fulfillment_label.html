<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Etiqueta {{ detail.package_code }} · ECUVEL</title><style>@page{size:150mm 100mm;margin:0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef2f5;color:#000;font-family:Arial,sans-serif}.controls{display:flex;justify-content:center;gap:12px;padding:18px}.controls a,.controls button{min-height:42px;border:1px solid #b9c3cd;border-radius:8px;background:#fff;color:#172033;font:inherit;font-weight:700;padding:0 18px;text-decoration:none}.controls button{border-color:#005146;background:#005146;color:#fff}.label{display:grid;width:150mm;height:100mm;place-content:center;justify-items:center;margin:0 auto 24px;padding:11mm 12mm;overflow:hidden;background:#fff;text-align:center}.label img{display:block;width:122mm;max-height:53mm;object-fit:contain}.code{margin:3mm 0 0;font:700 18pt "Courier New",monospace;letter-spacing:.08em}.order{margin:5mm 0 0;font-size:14pt;font-weight:700}@media print{html,body{width:150mm;height:100mm;background:#fff}.controls{display:none!important}.label{margin:0}}</style></head><body><nav class="controls"><a href="{{ url_for('admin.fulfillment_detail', package_code=detail.package_code) }}">Volver al paquete</a><button type="button" onclick="window.print()">Imprimir etiqueta</button></nav><main class="label"><img src="data:image/svg+xml;base64,{{ barcode_data }}" alt="Código de barras {{ detail.barcode }}"><p class="code">{{ detail.package_code }}</p><p class="order">Pedido: {{ detail.order_number }}</p></main></body></html>
